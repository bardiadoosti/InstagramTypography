<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استوری موزیک اینستاگرام | Instagram Music Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="head.js"></script>

  <style>
    :root {
      --bg-dark: #0b0d12;
      --panel-bg: #131720;
      --border: #232938;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Vazirmatn', 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(19, 23, 32, 0.85);
      backdrop-filter: blur(12px);
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.88rem;
      transition: color 0.2s;
    }

    header a:hover {
      color: var(--text-main);
    }

    .workspace {
      display: grid;
      grid-template-columns: 410px 1fr;
      flex: 1;
      height: calc(100vh - 57px);
      overflow: hidden;
    }

    .sidebar {
      background: var(--panel-bg);
      border-left: 1px solid var(--border);
      padding: 20px 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .template-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--bg-dark);
      padding: 5px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 12px;
      border-radius: 7px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      font-size: 0.83rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 9px 12px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .file-upload {
      border: 1px dashed var(--border);
      background: var(--bg-dark);
      padding: 11px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      display: block;
      font-size: 0.85rem;
    }

    .file-upload:hover {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.05);
    }

    .file-upload input {
      display: none;
    }

    .btn-clear {
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.28);
      padding: 7px 10px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      display: none;
      transition: background 0.2s;
    }

    .btn-clear:hover {
      background: rgba(239, 68, 68, 0.22);
    }

    .btn-secondary {
      background: rgba(99, 102, 241, 0.14);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.35);
      padding: 9px 12px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(99, 102, 241, 0.25);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 13px 18px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.94rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.83rem;
      color: var(--text-muted);
      cursor: pointer;
      margin-top: 2px;
      justify-content: flex-start;
    }

    .checkbox-row input {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .preview-pane {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      background: radial-gradient(circle at center, #181d29 0%, #0b0d12 100%);
    }

    .canvas-wrapper {
      height: calc(100vh - 135px);
      aspect-ratio: 9 / 16;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
      background: #000;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .status-badge {
      margin-top: 12px;
      font-size: 0.84rem;
      color: var(--text-muted);
      text-align: center;
    }

    .error-banner {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      line-height: 1.5;
    }

    @media (max-width: 900px) {
      body {
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }
      header {
        padding: 10px 16px;
        flex-shrink: 0;
      }
      header h1 {
        font-size: 0.98rem;
      }
      header a {
        font-size: 0.8rem;
      }
      .workspace {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 45px);
        height: calc(100dvh - 45px);
        overflow: hidden;
      }
      .preview-pane {
        order: 1;
        flex: 0 0 42vh;
        height: 42vh;
        padding: 10px 12px 8px;
        border-bottom: 1px solid var(--border);
        z-index: 10;
      }
      .canvas-wrapper {
        height: calc(100% - 22px);
        max-height: 100%;
        border-radius: 12px;
      }
      .status-badge {
        margin-top: 6px;
        font-size: 0.75rem;
      }
      .sidebar {
        order: 2;
        flex: 1 1 auto;
        border-left: none;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 16px 16px 32px;
        gap: 16px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>🎵 سازنده استوری موزیک</h1>
    <a href="index.html">بازگشت به صفحه اصلی ←</a>
  </header>

  <div class="workspace">
    <!-- Controls Sidebar -->
    <aside class="sidebar">
      <div>
        <div class="section-title">۱. انتخاب قالب (Template)</div>
        <div class="template-tabs">
          <button type="button" class="tab-btn active" data-template="player">موزیک پلیر</button>
          <button type="button" class="tab-btn" data-template="vinyl">صفحه گرامافون (Vinyl)</button>
        </div>
      </div>

      <!-- Cover, Background & Audio Uploads -->
      <div class="control-group">
        <div class="section-title">۲. فایل‌های ورودی (تصاویر و فایل صوتی)</div>
        <label class="file-upload">
          <input type="file" id="coverInput" accept="image/*" />
          <span id="uploadLabel">📸 آپلود تصویر کاور آهنگ (مربع)</span>
        </label>

        <label class="file-upload">
          <input type="file" id="bgInput" accept="image/*" />
          <span id="bgUploadLabel">🖼️ آپلود تصویر پس‌زمینه دلخواه (اختیاری)</span>
        </label>
        <button type="button" class="btn-clear" id="clearBgBtn">✕ حذف تصویر پس‌زمینه و بازگشت به حالت خودکار</button>

        <label class="file-upload">
          <input type="file" id="audioInput" accept="audio/*,.mp3,.wav,.m4a,.ogg,.aac,.flac" />
          <span id="audioUploadLabel">🎧 آپلود فایل صوتی آهنگ (MP3 / WAV)</span>
        </label>
        <div style="display: flex; gap: 8px;">
          <button type="button" class="btn-secondary" id="previewAudioBtn" style="flex: 1;">🔊 پخش پیش‌نمایش صدا</button>
          <button type="button" class="btn-clear" id="clearAudioBtn">✕ حذف صدا</button>
        </div>
        <label class="checkbox-row">
          <input type="checkbox" id="audioFadeCheck" checked />
          <span>اعمال Fade-in / Fade-out نرم روی صدای ویدیو</span>
        </label>

        <div class="control-row" style="margin-top: 4px;">
          <div>
            <label><span>تاری پس‌زمینه</span> <span id="bgBlurVal">0px</span></label>
            <input type="range" id="bgBlur" min="0" max="60" value="0" />
          </div>
          <div>
            <label><span>تیرگی پس‌زمینه</span> <span id="bgDimVal">35%</span></label>
            <input type="range" id="bgDim" min="0" max="85" value="35" />
          </div>
        </div>
      </div>

      <div class="control-group">
        <div class="section-title">۳. اطلاعات قطعه و زمان‌بندی</div>
        <label>نام قطعه (Song Title)</label>
        <input type="text" id="songTitle" value="مرغ سحر" placeholder="نام آهنگ..." />

        <label style="margin-top: 4px;">نام هنرمند (Artist)</label>
        <input type="text" id="artistName" value="محمدرضا شجریان" placeholder="نام خواننده یا نوازنده..." />

        <div class="control-row" style="margin-top: 6px;">
          <div>
            <label>زمان کل (دقیقه : ثانیه)</label>
            <div class="control-row">
              <input type="number" id="totalMin" value="4" min="0" max="99" title="Minutes" />
              <input type="number" id="totalSec" value="35" min="0" max="59" title="Seconds" />
            </div>
          </div>
          <div>
            <label>شروع پخش (دقیقه : ثانیه)</label>
            <div class="control-row">
              <input type="number" id="startMin" value="1" min="0" max="99" title="Start Min" />
              <input type="number" id="startSec" value="20" min="0" max="59" title="Start Sec" />
            </div>
          </div>
        </div>
      </div>

      <!-- Player Specific Settings -->
      <div id="playerSettings" class="control-group">
        <div class="section-title">۴. تنظیمات ظاهری پلیر</div>
        <label>سبک ظاهری پلیر (Theme)</label>
        <select id="playerStyle">
          <option value="apple">Apple Music (شیشه‌ای مدرن)</option>
          <option value="spotify">Spotify (کارت تیره کلاسیک)</option>
          <option value="minimal">Minimalist (مینیمال و بدون کادر)</option>
          <option value="cartoon">Cartoon / Pop-Art (کارتونی و کمیک)</option>
          <option value="retro">Retro OS 95 (نوستالژی ویندوز کلاسیک)</option>
          <option value="neon">Cyberpunk Neon (نئونی و شبانه)</option>
          <option value="polaroid">Polaroid Frame (قاب عکس پولاروید)</option>
        </select>
      </div>

      <!-- Vinyl Specific Settings -->
      <div id="vinylSettings" class="control-group" style="display: none;">
        <div class="section-title">۴. تنظیمات گرامافون (Turntable)</div>
        <div class="control-row">
          <div>
            <label>دور چرخش در کل ویدیو</label>
            <select id="vinylRotations">
              <option value="1">۱ دور کامل (ملایم)</option>
              <option value="2" selected>۲ دور کامل (استاندارد)</option>
              <option value="3">۳ دور کامل (سریع)</option>
            </select>
          </div>
          <div>
            <label>اندازه لیبل وسط صفحه</label>
            <select id="labelSize">
              <option value="0.36">استاندارد (۳۶٪)</option>
              <option value="0.46">بزرگ (۴۶٪)</option>
              <option value="0.58">کاور کامل روی صفحه</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Export Settings -->
      <div class="control-group">
        <div class="section-title">۵. خروجی ویدیو (Export)</div>
        <div class="control-row">
          <div>
            <label>مدت ویدیو (ثانیه)</label>
            <input type="number" id="videoDuration" value="10" min="3" max="60" />
          </div>
          <div>
            <label>نرخ فریم (FPS)</label>
            <select id="videoFps">
              <option value="30">30 FPS</option>
              <option value="60" selected>60 FPS (روان)</option>
            </select>
          </div>
        </div>

        <div id="errorBanner" class="error-banner"></div>

        <button type="button" class="btn-primary" id="recordBtn">
          <span>🎬</span>
          <span id="recordBtnText">ضبط و دانلود ویدیوی استوری</span>
        </button>
      </div>
    </aside>

    <!-- Live Canvas Preview -->
    <main class="preview-pane">
      <div class="canvas-wrapper">
        <canvas id="storyCanvas" width="1080" height="1920"></canvas>
      </div>
      <div class="status-badge" id="statusBadge">پیش‌نمایش زنده (۱۰۸۰×۱۹۲۰) — آماده ضبط</div>
    </main>
  </div>

  <script>
    const canvas = document.getElementById('storyCanvas');
    const ctx = canvas.getContext('2d');

    const tabBtns = document.querySelectorAll('.tab-btn');
    const playerSettings = document.getElementById('playerSettings');
    const vinylSettings = document.getElementById('vinylSettings');
    const coverInput = document.getElementById('coverInput');
    const uploadLabel = document.getElementById('uploadLabel');
    const bgInput = document.getElementById('bgInput');
    const bgUploadLabel = document.getElementById('bgUploadLabel');
    const clearBgBtn = document.getElementById('clearBgBtn');
    const audioInput = document.getElementById('audioInput');
    const audioUploadLabel = document.getElementById('audioUploadLabel');
    const previewAudioBtn = document.getElementById('previewAudioBtn');
    const clearAudioBtn = document.getElementById('clearAudioBtn');
    const audioFadeCheck = document.getElementById('audioFadeCheck');

    const bgBlurInput = document.getElementById('bgBlur');
    const bgBlurVal = document.getElementById('bgBlurVal');
    const bgDimInput = document.getElementById('bgDim');
    const bgDimVal = document.getElementById('bgDimVal');

    const songTitleInput = document.getElementById('songTitle');
    const artistNameInput = document.getElementById('artistName');
    const playerStyleSelect = document.getElementById('playerStyle');
    const totalMinInput = document.getElementById('totalMin');
    const totalSecInput = document.getElementById('totalSec');
    const startMinInput = document.getElementById('startMin');
    const startSecInput = document.getElementById('startSec');
    const vinylRotationsSelect = document.getElementById('vinylRotations');
    const labelSizeSelect = document.getElementById('labelSize');
    const videoDurationInput = document.getElementById('videoDuration');
    const videoFpsSelect = document.getElementById('videoFps');
    const recordBtn = document.getElementById('recordBtn');
    const recordBtnText = document.getElementById('recordBtnText');
    const statusBadge = document.getElementById('statusBadge');
    const errorBanner = document.getElementById('errorBanner');

    let currentTemplate = 'player';
    let coverImage = null;
    let bgImage = null;
    let dominantColor = { r: 35, g: 42, b: 68 };
    let animationStartTime = performance.now();
    let isRecording = false;
    let recordStartTimestamp = 0;

    // Web Audio API State
    let audioCtx = null;
    let decodedAudioBuffer = null;
    let previewSourceNode = null;
    let isPreviewingAudio = false;

    function showError(msg) {
      if (!msg) {
        errorBanner.style.display = 'none';
        errorBanner.textContent = '';
        return;
      }
      errorBanner.textContent = msg;
      errorBanner.style.display = 'block';
    }

    async function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
      return audioCtx;
    }

    function getStartOffsetSeconds() {
      return Math.max(0, (parseInt(startMinInput.value, 10) || 0) * 60 + (parseInt(startSecInput.value, 10) || 0));
    }

    function getClipDurationSeconds() {
      return Math.max(2, parseFloat(videoDurationInput.value) || 10);
    }

    function stopPreviewAudio() {
      if (previewSourceNode) {
        try {
          previewSourceNode.onended = null;
          previewSourceNode.stop();
        } catch (e) {}
        try {
          previewSourceNode.disconnect();
        } catch (e) {}
        previewSourceNode = null;
      }
      isPreviewingAudio = false;
      previewAudioBtn.textContent = '🔊 پخش پیش‌نمایش صدا';
    }

    async function togglePreviewAudio() {
      if (!decodedAudioBuffer || isRecording) return;
      if (isPreviewingAudio) {
        stopPreviewAudio();
        return;
      }

      try {
        showError('');
        const actx = await getAudioContext();
        const clipDuration = getClipDurationSeconds();
        const maxValidStart = Math.max(0, decodedAudioBuffer.duration - 0.25);
        const startOffset = Math.min(getStartOffsetSeconds(), maxValidStart);
        const playDuration = Math.max(0.2, Math.min(clipDuration, decodedAudioBuffer.duration - startOffset));

        const source = actx.createBufferSource();
        source.buffer = decodedAudioBuffer;

        const gainNode = actx.createGain();
        const now = actx.currentTime;

        if (audioFadeCheck.checked && playDuration > 1.0) {
          gainNode.gain.setValueAtTime(0.001, now);
          gainNode.gain.linearRampToValueAtTime(1.0, now + 0.4);
          gainNode.gain.setValueAtTime(1.0, now + Math.max(0.4, playDuration - 0.4));
          gainNode.gain.linearRampToValueAtTime(0.001, now + playDuration);
        } else {
          gainNode.gain.setValueAtTime(1.0, now);
        }

        source.connect(gainNode);
        gainNode.connect(actx.destination);

        animationStartTime = performance.now();
        source.start(0, startOffset, playDuration);
        previewSourceNode = source;
        isPreviewingAudio = true;
        previewAudioBtn.textContent = '⏹️ توقف پیش‌نمایش صدا';

        source.onended = () => {
          if (previewSourceNode === source) {
            stopPreviewAudio();
          }
        };
      } catch (err) {
        showError('خطا در پخش پیش‌نمایش صدا: ' + (err.message || err));
      }
    }

    previewAudioBtn.addEventListener('click', togglePreviewAudio);

    audioInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      stopPreviewAudio();
      showError('');
      audioUploadLabel.textContent = '⏳ در حال پردازش فایل صوتی...';
      statusBadge.textContent = 'در حال رمزگشایی فایل صوتی...';

      try {
        const arrayBuffer = await file.arrayBuffer();
        const actx = await getAudioContext();
        // Use callback-compatible wrapper for older Safari versions alongside Promise
        decodedAudioBuffer = await new Promise((resolve, reject) => {
          actx.decodeAudioData(arrayBuffer.slice(0), resolve, reject);
        });

        const totalDurationSec = Math.round(decodedAudioBuffer.duration);
        totalMinInput.value = Math.floor(totalDurationSec / 60);
        totalSecInput.value = totalDurationSec % 60;

        // Ensure start time does not exceed track duration
        if (getStartOffsetSeconds() >= totalDurationSec) {
          startMinInput.value = 0;
          startSecInput.value = 0;
        }

        audioUploadLabel.textContent = `✅ صدا: ${file.name}`;
        previewAudioBtn.style.display = 'flex';
        clearAudioBtn.style.display = 'block';
        statusBadge.textContent = `✅ فایل صوتی آماده است (${formatTime(totalDurationSec)}) — آماده ضبط با صدا`;
      } catch (err) {
        console.error('Audio decode error:', err);
        decodedAudioBuffer = null;
        audioUploadLabel.textContent = '❌ خطا در خواندن فایل صوتی';
        showError('فرمت فایل صوتی پشتیبانی نشد. لطفاً از فایل MP3 یا WAV استاندارد استفاده کنید.');
        statusBadge.textContent = 'خطا در بارگذاری فایل صوتی';
      }
    });

    clearAudioBtn.addEventListener('click', () => {
      stopPreviewAudio();
      decodedAudioBuffer = null;
      audioInput.value = '';
      audioUploadLabel.textContent = '🎧 آپلود فایل صوتی آهنگ (MP3 / WAV)';
      previewAudioBtn.style.display = 'none';
      clearAudioBtn.style.display = 'none';
      statusBadge.textContent = 'فایل صوتی حذف شد';
    });

    bgBlurInput.addEventListener('input', () => {
      bgBlurVal.textContent = `${bgBlurInput.value}px`;
    });
    bgDimInput.addEventListener('input', () => {
      bgDimVal.textContent = `${bgDimInput.value}%`;
    });

    function createDefaultArtwork() {
      const off = document.createElement('canvas');
      off.width = 800;
      off.height = 800;
      const octx = off.getContext('2d');

      const grad = octx.createLinearGradient(0, 0, 800, 800);
      grad.addColorStop(0, '#1e3a8a');
      grad.addColorStop(0.5, '#6d28d9');
      grad.addColorStop(1, '#be185d');
      octx.fillStyle = grad;
      octx.fillRect(0, 0, 800, 800);

      octx.strokeStyle = 'rgba(255,255,255,0.18)';
      octx.lineWidth = 4;
      for (let r = 100; r <= 340; r += 60) {
        octx.beginPath();
        octx.arc(400, 400, r, 0, Math.PI * 2);
        octx.stroke();
      }

      const img = new Image();
      img.onload = () => {
        coverImage = img;
        extractDominantColor(img);
      };
      img.src = off.toDataURL();
    }

    function extractDominantColor(img) {
      try {
        const sample = document.createElement('canvas');
        sample.width = 16;
        sample.height = 16;
        const sctx = sample.getContext('2d');
        sctx.drawImage(img, 0, 0, 16, 16);
        const data = sctx.getImageData(0, 0, 16, 16).data;
        let r = 0, g = 0, b = 0, count = 0;
        for (let i = 0; i < data.length; i += 4) {
          r += data[i];
          g += data[i + 1];
          b += data[i + 2];
          count++;
        }
        dominantColor = {
          r: Math.round(r / count),
          g: Math.round(g / count),
          b: Math.round(b / count)
        };
      } catch (e) {
        dominantColor = { r: 35, g: 42, b: 68 };
      }
    }

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTemplate = btn.dataset.template;
        playerSettings.style.display = currentTemplate === 'player' ? 'flex' : 'none';
        vinylSettings.style.display = currentTemplate === 'vinyl' ? 'flex' : 'none';
        animationStartTime = performance.now();
      });
    });

    coverInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      uploadLabel.textContent = `✅ کاور: ${file.name}`;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          coverImage = img;
          extractDominantColor(img);
          animationStartTime = performance.now();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    bgInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      bgUploadLabel.textContent = `✅ پس‌زمینه: ${file.name}`;
      clearBgBtn.style.display = 'block';
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          bgImage = img;
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    clearBgBtn.addEventListener('click', () => {
      bgImage = null;
      bgInput.value = '';
      bgUploadLabel.textContent = '🖼️ آپلود تصویر پس‌زمینه دلخواه (اختیاری)';
      clearBgBtn.style.display = 'none';
    });

    function formatTime(totalSeconds) {
      const sec = Math.max(0, Math.floor(totalSeconds));
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawSquareImage(ctx, img, dx, dy, size) {
      if (!img) return;
      const minDim = Math.min(img.width, img.height);
      const sx = (img.width - minDim) / 2;
      const sy = (img.height - minDim) / 2;
      ctx.drawImage(img, sx, sy, minDim, minDim, dx, dy, size, size);
    }

    function drawObjectFitCover(ctx, img, targetW, targetH) {
      if (!img) return;
      const imgRatio = img.width / img.height;
      const targetRatio = targetW / targetH;
      let sw, sh, sx, sy;

      if (imgRatio > targetRatio) {
        sh = img.height;
        sw = img.height * targetRatio;
        sx = (img.width - sw) / 2;
        sy = 0;
      } else {
        sw = img.width;
        sh = img.width / targetRatio;
        sx = 0;
        sy = (img.height - sh) / 2;
      }
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetW, targetH);
    }

    function drawBackground(elapsedSec, durationSec) {
      const blurPx = parseInt(bgBlurInput.value, 10) || 0;
      const dimRatio = (parseInt(bgDimInput.value, 10) || 0) / 100;

      if (bgImage) {
        ctx.save();
        ctx.fillStyle = '#07090e';
        ctx.fillRect(0, 0, 1080, 1920);

        if (blurPx > 0 && 'filter' in ctx) {
          ctx.filter = `blur(${blurPx}px)`;
          ctx.translate(540, 960);
          ctx.scale(1.08, 1.08);
          ctx.translate(-540, -960);
        }
        drawObjectFitCover(ctx, bgImage, 1080, 1920);
        ctx.restore();
      } else {
        const { r, g, b } = dominantColor;
        const grad = ctx.createLinearGradient(0, 0, 1080, 1920);
        grad.addColorStop(0, `rgb(${Math.max(10, r - 30)}, ${Math.max(10, g - 30)}, ${Math.max(15, b - 20)})`);
        grad.addColorStop(0.5, `rgb(${Math.floor(r * 0.45)}, ${Math.floor(g * 0.45)}, ${Math.floor(b * 0.45)})`);
        grad.addColorStop(1, '#07090e');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1080, 1920);

        if (coverImage) {
          ctx.save();
          ctx.globalAlpha = 0.28;
          if ('filter' in ctx) {
            ctx.filter = `blur(${90 + blurPx}px)`;
          }
          const breathe = 1 + 0.05 * Math.sin((elapsedSec / durationSec) * Math.PI * 2);
          const bgSize = 1920 * breathe;
          ctx.drawImage(coverImage, (1080 - bgSize) / 2, (1920 - bgSize) / 2, bgSize, bgSize);
          ctx.restore();
        }
      }

      if (dimRatio > 0) {
        ctx.fillStyle = `rgba(0, 0, 0, ${dimRatio})`;
        ctx.fillRect(0, 0, 1080, 1920);
      }

      const rad = ctx.createRadialGradient(540, 960, 350, 540, 960, 1250);
      rad.addColorStop(0, 'rgba(0,0,0,0)');
      rad.addColorStop(1, 'rgba(0,0,0,0.45)');
      ctx.fillStyle = rad;
      ctx.fillRect(0, 0, 1080, 1920);
    }

    function renderPlayerTemplate(elapsedSec, clipDuration) {
      drawBackground(elapsedSec, clipDuration);

      const style = playerStyleSelect.value;
      const title = songTitleInput.value || 'بدون عنوان';
      const artist = artistNameInput.value || 'ناشناس';

      const totalSongSec = Math.max(1, (parseInt(totalMinInput.value, 10) || 0) * 60 + (parseInt(totalSecInput.value, 10) || 0));
      const startSongSec = getStartOffsetSeconds();
      const currentSongSec = Math.min(totalSongSec, startSongSec + elapsedSec);
      const progress = Math.min(1, Math.max(0, currentSongSec / totalSongSec));

      if (style === 'minimal') {
        renderMinimalPlayer(title, artist, currentSongSec, totalSongSec, progress);
        return;
      }
      if (style === 'cartoon') {
        renderCartoonPlayer(title, artist, currentSongSec, totalSongSec, progress, elapsedSec);
        return;
      }
      if (style === 'retro') {
        renderRetroPlayer(title, artist, currentSongSec, totalSongSec, progress);
        return;
      }
      if (style === 'neon') {
        renderNeonPlayer(title, artist, currentSongSec, totalSongSec, progress, elapsedSec);
        return;
      }
      if (style === 'polaroid') {
        renderPolaroidPlayer(title, artist, currentSongSec, totalSongSec, progress);
        return;
      }

      // Default: Apple Music & Spotify Card Styles
      const cardW = 880;
      const cardH = 1280;
      const cardX = (1080 - cardW) / 2;
      const cardY = (1920 - cardH) / 2;

      ctx.save();
      roundRect(ctx, cardX, cardY, cardW, cardH, 48);
      if (style === 'apple') {
        ctx.fillStyle = 'rgba(20, 24, 34, 0.55)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
      } else {
        ctx.fillStyle = 'rgba(18, 18, 18, 0.84)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      }
      ctx.lineWidth = 2;
      ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
      ctx.shadowBlur = 60;
      ctx.shadowOffsetY = 24;
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      const artSize = 720;
      const artX = (1080 - artSize) / 2;
      const artY = cardY + 80;

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
      ctx.shadowBlur = 45;
      ctx.shadowOffsetY = 20;
      roundRect(ctx, artX, artY, artSize, artSize, 32);
      ctx.clip();
      drawSquareImage(ctx, coverImage, artX, artY, artSize);
      ctx.restore();

      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 46px "Vazirmatn", "Inter", sans-serif';
      ctx.fillText(title, 540, artY + artSize + 92);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
      ctx.font = '500 32px "Vazirmatn", "Inter", sans-serif';
      ctx.fillText(artist, 540, artY + artSize + 148);
      ctx.restore();

      const barW = 720;
      const barH = 10;
      const barX = (1080 - barW) / 2;
      const barY = artY + artSize + 215;

      ctx.save();
      roundRect(ctx, barX, barY, barW, barH, 5);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.24)';
      ctx.fill();

      const fillW = Math.max(barH, barW * progress);
      roundRect(ctx, barX, barY, fillW, barH, 5);
      ctx.fillStyle = style === 'spotify' ? '#1db954' : '#ffffff';
      ctx.fill();

      const knobX = barX + barW * progress;
      const knobY = barY + barH / 2;
      ctx.beginPath();
      ctx.arc(knobX, knobY, 13, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.direction = 'ltr';
      ctx.font = '500 24px "Inter", sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
      ctx.textAlign = 'left';
      ctx.fillText(formatTime(currentSongSec), barX, barY + 46);

      ctx.textAlign = 'right';
      const rightLabel = style === 'apple'
        ? `-${formatTime(totalSongSec - currentSongSec)}`
        : formatTime(totalSongSec);
      ctx.fillText(rightLabel, barX + barW, barY + 46);
      ctx.restore();

      const controlsY = barY + 135;
      drawTransportControls(540, controlsY, style, '#ffffff', '#000000');
    }

    // 1. MINIMALIST THEME (Clean floating artwork, hairline scrubber, editorial look)
    function renderMinimalPlayer(title, artist, currentSongSec, totalSongSec, progress) {
      const artSize = 780;
      const artX = (1080 - artSize) / 2;
      const artY = 330;

      // Floating shadow & crisp rounded cover
      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
      ctx.shadowBlur = 70;
      ctx.shadowOffsetY = 30;
      roundRect(ctx, artX, artY, artSize, artSize, 24);
      ctx.clip();
      drawSquareImage(ctx, coverImage, artX, artY, artSize);
      ctx.restore();

      // Subtle thin border on cover
      ctx.save();
      roundRect(ctx, artX, artY, artSize, artSize, 24);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();

      // Editorial Typography
      ctx.save();
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#ffffff';
      ctx.font = '600 48px "Vazirmatn", "Inter", sans-serif';
      ctx.fillText(title, 540, artY + artSize + 105);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
      ctx.font = '400 32px "Vazirmatn", "Inter", sans-serif';
      ctx.fillText(artist, 540, artY + artSize + 162);
      ctx.restore();

      // Ultra-slim hairline progress bar
      const barW = 780;
      const barX = (1080 - barW) / 2;
      const barY = artY + artSize + 235;

      ctx.save();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
      ctx.fillRect(barX, barY, barW, 4);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(barX, barY, barW * progress, 4);

      // Minimalist vertical tick thumb
      const knobX = barX + barW * progress;
      roundRect(ctx, knobX - 3, barY - 8, 6, 20, 3);
      ctx.fill();
      ctx.restore();

      // Timestamps
      ctx.save();
      ctx.direction = 'ltr';
      ctx.font = '400 23px "Inter", sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.textAlign = 'left';
      ctx.fillText(formatTime(currentSongSec), barX, barY + 42);
      ctx.textAlign = 'right';
      ctx.fillText(formatTime(totalSongSec), barX + barW, barY + 42);
      ctx.restore();

      // Minimalist Wire/Clean Controls
      drawTransportControls(540, barY + 125, 'minimal', '#ffffff', '#000000');
    }

    // 2. CARTOON / NEO-BRUTALISM POP-ART THEME
    function renderCartoonPlayer(title, artist, currentSongSec, totalSongSec, progress, elapsedSec) {
      const cardW = 860;
      const cardH = 1280;
      const cardX = (1080 - cardW) / 2;
      const cardY = (1920 - cardH) / 2;

      // Hard Offset Comic Shadow
      ctx.save();
      roundRect(ctx, cardX + 20, cardY + 20, cardW, cardH, 44);
      ctx.fillStyle = '#111111';
      ctx.fill();

      // Cream Pop-Art Card Body
      roundRect(ctx, cardX, cardY, cardW, cardH, 44);
      ctx.fillStyle = '#fffbeb';
      ctx.fill();
      ctx.lineWidth = 8;
      ctx.strokeStyle = '#111111';
      ctx.stroke();
      ctx.restore();

      // Top Decorative Comic Dots (Halftone header accent)
      ctx.save();
      const colors = ['#ff595e', '#ffca3a', '#8ac926'];
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(cardX + 65 + i * 44, cardY + 52, 14, 0, Math.PI * 2);
        ctx.fillStyle = colors[i];
        ctx.fill();
        ctx.lineWidth = 4.5;
        ctx.strokeStyle = '#111111';
        ctx.stroke();
      }
      ctx.restore();

      // Cover Art with Bold Black Outline & Hard Shadow
      const artSize = 680;
      const artX = (1080 - artSize) / 2;
      const artY = cardY + 95;

      ctx.save();
      roundRect(ctx, artX + 12, artY + 12, artSize, artSize, 28);
      ctx.fillStyle = '#111111';
      ctx.fill();

      roundRect(ctx, artX, artY, artSize, artSize, 28);
      ctx.save();
      ctx.clip();
      drawSquareImage(ctx, coverImage, artX, artY, artSize);
      ctx.restore();

      roundRect(ctx, artX, artY, artSize, artSize, 28);
      ctx.lineWidth = 7;
      ctx.strokeStyle = '#111111';
      ctx.stroke();
      ctx.restore();

      // Floating "NOW PLAYING!" Comic Sticker Badge
      ctx.save();
      const wobble = Math.sin(elapsedSec * 4) * 0.04;
      ctx.translate(artX + artSize - 40, artY + 10);
      ctx.rotate(0.14 + wobble);
      roundRect(ctx, -110, -28, 220, 56, 28);
      ctx.fillStyle = '#ffca3a';
      ctx.fill();
      ctx.lineWidth = 5;
      ctx.strokeStyle = '#111111';
      ctx.stroke();
      ctx.fillStyle = '#111111';
      ctx.font = '800 22px "Inter", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('★ NOW PLAYING', 0, 2);
      ctx.restore();

      // Bold Cartoon Title & Artist
      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#111111';
      ctx.font = '700 48px "Vazirmatn", "Inter", sans-serif';
      ctx.fillText(title, 540, artY + artSize + 92);

      ctx.fillStyle = '#6b21a8';
      ctx.font = '600 32px "Vazirmatn", "Inter", sans-serif';
      ctx.fillText(artist, 540, artY + artSize + 146);
      ctx.restore();

      // Chunky Cartoon Progress Bar
      const barW = 700;
      const barH = 30;
      const barX = (1080 - barW) / 2;
      const barY = artY + artSize + 198;

      ctx.save();
      roundRect(ctx, barX, barY, barW, barH, 15);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#111111';
      ctx.stroke();

      const fillW = Math.max(barH, barW * progress);
      roundRect(ctx, barX, barY, fillW, barH, 15);
      ctx.fillStyle = '#ff595e';
      ctx.fill();
      ctx.stroke();

      // Big Yellow Cartoon Scrubber Knob
      const knobX = barX + barW * progress;
      const knobY = barY + barH / 2;
      ctx.beginPath();
      ctx.arc(knobX, knobY, 22, 0, Math.PI * 2);
      ctx.fillStyle = '#ffca3a';
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#111111';
      ctx.stroke();
      ctx.restore();

      // Timestamps
      ctx.save();
      ctx.direction = 'ltr';
      ctx.font = '700 24px "Inter", sans-serif';
      ctx.fillStyle = '#111111';
      ctx.textAlign = 'left';
      ctx.fillText(formatTime(currentSongSec), barX, barY + 66);
      ctx.textAlign = 'right';
      ctx.fillText(formatTime(totalSongSec), barX + barW, barY + 66);
      ctx.restore();

      // Cartoon Button Controls
      const cy = barY + 145;
      const btnConfigs = [
        { x: 540 - 165, r: 44, bg: '#38bdf8' },
        { x: 540, r: 58, bg: '#ffca3a' },
        { x: 540 + 165, r: 44, bg: '#38bdf8' }
      ];
      btnConfigs.forEach(b => {
        ctx.save();
        ctx.beginPath();
        ctx.arc(b.x + 6, cy + 6, b.r, 0, Math.PI * 2);
        ctx.fillStyle = '#111111';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(b.x, cy, b.r, 0, Math.PI * 2);
        ctx.fillStyle = b.bg;
        ctx.fill();
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#111111';
        ctx.stroke();
        ctx.restore();
      });

      drawTransportControls(540, cy, 'cartoon', '#111111', '#111111');
    }

    // 3. RETRO OS 95 THEME (Classic 90s Beveled Window + LCD Display)
    function renderRetroPlayer(title, artist, currentSongSec, totalSongSec, progress) {
      const cardW = 860;
      const cardH = 1280;
      const cardX = (1080 - cardW) / 2;
      const cardY = (1920 - cardH) / 2;

      function drawBevelBox(x, y, w, h, sunken = false, fill = '#c0c0c0') {
        ctx.save();
        ctx.fillStyle = fill;
        ctx.fillRect(x, y, w, h);

        const light = sunken ? '#404040' : '#ffffff';
        const dark = sunken ? '#ffffff' : '#404040';
        const mid = '#808080';

        ctx.fillStyle = light;
        ctx.fillRect(x, y, w, 5);
        ctx.fillRect(x, y, 5, h);

        ctx.fillStyle = dark;
        ctx.fillRect(x, y + h - 5, w, 5);
        ctx.fillRect(x + w - 5, y, 5, h);

        ctx.strokeStyle = mid;
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 5, y + 5, w - 10, h - 10);
        ctx.restore();
      }

      // Outer Drop Shadow
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(cardX + 18, cardY + 18, cardW, cardH);
      ctx.restore();

      // Main Win95 Dialog Window
      drawBevelBox(cardX, cardY, cardW, cardH, false, '#c0c0c0');

      // Classic Navy Title Bar
      const titleBarX = cardX + 18;
      const titleBarY = cardY + 18;
      const titleBarW = cardW - 36;
      const titleBarH = 64;
      ctx.save();
      const winGrad = ctx.createLinearGradient(titleBarX, titleBarY, titleBarX + titleBarW, titleBarY);
      winGrad.addColorStop(0, '#000080');
      winGrad.addColorStop(1, '#1084d0');
      ctx.fillStyle = winGrad;
      ctx.fillRect(titleBarX, titleBarY, titleBarW, titleBarH);

      ctx.direction = 'ltr';
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 28px "Inter", monospace';
      ctx.textAlign = 'left';
      ctx.fillText('💿 CDPLAYER.EXE - Audio Story', titleBarX + 18, titleBarY + 42);

      // Minimize, Maximize, Close Buttons
      const labels = ['_', '□', '×'];
      labels.forEach((lbl, idx) => {
        const bx = titleBarX + titleBarW - 156 + idx * 50;
        const by = titleBarY + 10;
        drawBevelBox(bx, by, 44, 44, false, '#c0c0c0');
        ctx.fillStyle = '#000000';
        ctx.font = '700 26px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(lbl, bx + 22, by + 31);
      });
      ctx.restore();

      // Sunken Cover Art Frame
      const artSize = 650;
      const artX = (1080 - artSize) / 2;
      const artY = cardY + 110;
      drawBevelBox(artX - 8, artY - 8, artSize + 16, artSize + 16, true, '#000000');
      drawSquareImage(ctx, coverImage, artX, artY, artSize);

      // Sunken Black/Green Digital LCD Readout Box
      const lcdX = artX - 8;
      const lcdY = artY + artSize + 30;
      const lcdW = artSize + 16;
      const lcdH = 175;
      drawBevelBox(lcdX, lcdY, lcdW, lcdH, true, '#0a1912');

      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#4ade80';
      ctx.font = '700 42px "Vazirmatn", "Inter", monospace';
      ctx.fillText(title, 540, lcdY + 68);

      ctx.fillStyle = '#22c55e';
      ctx.font = '500 28px "Vazirmatn", "Inter", monospace';
      ctx.fillText(artist, 540, lcdY + 118);

      ctx.direction = 'ltr';
      ctx.font = '700 24px monospace';
      ctx.fillStyle = '#86efac';
      ctx.fillText(`[ TRACK 01   ${formatTime(currentSongSec)} / ${formatTime(totalSongSec)} ]`, 540, lcdY + 156);
      ctx.restore();

      // Segmented Win95 Progress Bar
      const barX = lcdX;
      const barY = lcdY + lcdH + 28;
      const barW = lcdW;
      const barH = 38;
      drawBevelBox(barX, barY, barW, barH, true, '#ffffff');

      const totalBlocks = 22;
      const activeBlocks = Math.round(progress * totalBlocks);
      const pad = 8;
      const blockW = (barW - pad * 2 - (totalBlocks - 1) * 5) / totalBlocks;
      ctx.save();
      ctx.fillStyle = '#000080';
      for (let i = 0; i < activeBlocks; i++) {
        ctx.fillRect(barX + pad + i * (blockW + 5), barY + pad, blockW, barH - pad * 2);
      }
      ctx.restore();

      // 3D Beveled Push Buttons for Transport
      const btnY = barY + 72;
      const btnW = 160;
      const btnH = 82;
      const centers = [540 - 185, 540, 540 + 185];
      centers.forEach(cx => {
        drawBevelBox(cx - btnW / 2, btnY, btnW, btnH, false, '#c0c0c0');
      });

      drawTransportControls(540, btnY + btnH / 2, 'retro', '#000000', '#000000');
    }

    // 4. CYBERPUNK NEON THEME (Glowing Synthwave Grid & Laser Equalizer)
    function drawNeonCard(cardX, cardY, cardW, cardH) {
      ctx.save();
      roundRect(ctx, cardX, cardY, cardW, cardH, 36);
      ctx.fillStyle = 'rgba(9, 10, 20, 0.88)';
      ctx.shadowColor = '#00f5d4';
      ctx.shadowBlur = 45;
      ctx.fill();

      const neonBorder = ctx.createLinearGradient(cardX, cardY, cardX + cardW, cardY + cardH);
      neonBorder.addColorStop(0, '#00f5d4');
      neonBorder.addColorStop(0.5, '#7b2cbf');
      neonBorder.addColorStop(1, '#ff007f');
      ctx.strokeStyle = neonBorder;
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.restore();
    }

    function drawNeonCover(artX, artY, artSize) {
      ctx.save();
      ctx.shadowColor = '#ff007f';
      ctx.shadowBlur = 35;
      roundRect(ctx, artX, artY, artSize, artSize, 24);
      ctx.clip();
      drawSquareImage(ctx, coverImage, artX, artY, artSize);
      ctx.restore();

      ctx.save();
      roundRect(ctx, artX, artY, artSize, artSize, 24);
      ctx.strokeStyle = '#00f5d4';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
    }

    function drawNeonEqualizer(eqY, elapsedSec) {
      const barCount = 29;
      const eqWidth = 560;
      const startEqX = (1080 - eqWidth) / 2;
      ctx.save();
      for (let i = 0; i < barCount; i++) {
        const wave = Math.abs(Math.sin(elapsedSec * 5.5 + i * 0.45)) * 0.75 + 0.25;
        const bh = 34 * wave;
        const bx = startEqX + i * (eqWidth / barCount);
        ctx.fillStyle = i % 2 === 0 ? '#00f5d4' : '#ff007f';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 10;
        roundRect(ctx, bx, eqY - bh / 2, 10, bh, 4);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawNeonTrackInfo(title, artist, titleY, artistY) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#00f5d4';
      ctx.shadowBlur = 18;
      ctx.font = '700 46px "Vazirmatn", "Inter", sans-serif';
      ctx.fillText(title, 540, titleY);

      ctx.fillStyle = '#ff70a6';
      ctx.shadowColor = '#ff007f';
      ctx.shadowBlur = 12;
      ctx.font = '500 32px "Vazirmatn", "Inter", sans-serif';
      ctx.fillText(artist, 540, artistY);
      ctx.restore();
    }

    function drawNeonScrubber(barX, barY, barW, barH, progress, currentSongSec, totalSongSec) {
      ctx.save();
      roundRect(ctx, barX, barY, barW, barH, 5);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.14)';
      ctx.fill();

      const fillW = Math.max(barH, barW * progress);
      const barGrad = ctx.createLinearGradient(barX, barY, barX + barW, barY);
      barGrad.addColorStop(0, '#00f5d4');
      barGrad.addColorStop(1, '#ff007f');
      roundRect(ctx, barX, barY, fillW, barH, 5);
      ctx.fillStyle = barGrad;
      ctx.shadowColor = '#00f5d4';
      ctx.shadowBlur = 18;
      ctx.fill();

      const knobX = barX + barW * progress;
      ctx.beginPath();
      ctx.arc(knobX, barY + barH / 2, 14, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ff007f';
      ctx.shadowBlur = 20;
      ctx.fill();
      ctx.restore();

      // Timestamps
      ctx.save();
      ctx.direction = 'ltr';
      ctx.font = '600 23px "Inter", monospace';
      ctx.fillStyle = '#00f5d4';
      ctx.textAlign = 'left';
      ctx.fillText(formatTime(currentSongSec), barX, barY + 46);
      ctx.fillStyle = '#ff70a6';
      ctx.textAlign = 'right';
      ctx.fillText(formatTime(totalSongSec), barX + barW, barY + 46);
      ctx.restore();
    }

    function drawNeonControls(controlsY) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(540, controlsY, 52, 0, Math.PI * 2);
      ctx.strokeStyle = '#00f5d4';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#00f5d4';
      ctx.shadowBlur = 20;
      ctx.stroke();
      ctx.restore();

      drawTransportControls(540, controlsY, 'neon', '#ffffff', '#ffffff');
    }

    function renderNeonPlayer(title, artist, currentSongSec, totalSongSec, progress, elapsedSec) {
      const cardW = 880;
      const cardH = 1280;
      const cardX = (1080 - cardW) / 2;
      const cardY = (1920 - cardH) / 2;

      drawNeonCard(cardX, cardY, cardW, cardH);

      const artSize = 680;
      const artX = (1080 - artSize) / 2;
      const artY = cardY + 75;

      drawNeonCover(artX, artY, artSize);

      const eqY = artY + artSize + 44;
      drawNeonEqualizer(eqY, elapsedSec);

      drawNeonTrackInfo(title, artist, artY + artSize + 120, artY + artSize + 172);

      const barW = 720;
      const barH = 10;
      const barX = (1080 - barW) / 2;
      const barY = artY + artSize + 230;

      drawNeonScrubber(barX, barY, barW, barH, progress, currentSongSec, totalSongSec);

      const controlsY = barY + 130;
      drawNeonControls(controlsY);
    }

    // 5. POLAROID GALLERY FRAME THEME
    function renderPolaroidPlayer(title, artist, currentSongSec, totalSongSec, progress) {
      const cardW = 840;
      const cardH = 1220;
      const cardX = (1080 - cardW) / 2;
      const cardY = (1920 - cardH) / 2;

      // Warm Paper Polaroid Card
      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
      ctx.shadowBlur = 55;
      ctx.shadowOffsetY = 25;
      roundRect(ctx, cardX, cardY, cardW, cardH, 16);
      ctx.fillStyle = '#faf8f5';
      ctx.fill();
      ctx.restore();

      // Translucent Washi Tape on Top Center
      ctx.save();
      ctx.translate(540, cardY + 4);
      ctx.rotate(-0.03);
      ctx.fillStyle = 'rgba(234, 179, 8, 0.32)';
      ctx.fillRect(-130, -24, 260, 48);
      ctx.restore();

      // Inner Square Photo Cutout
      const artSize = 740;
      const artX = (1080 - artSize) / 2;
      const artY = cardY + 52;

      ctx.save();
      ctx.fillStyle = '#111111';
      ctx.fillRect(artX, artY, artSize, artSize);
      drawSquareImage(ctx, coverImage, artX, artY, artSize);

      // Subtle inner photo vignette border
      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.lineWidth = 3;
      ctx.strokeRect(artX, artY, artSize, artSize);
      ctx.restore();

      // Dark Charcoal Typography on White Polaroid Bottom Margin
      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#1c1917';
      ctx.font = '700 46px "Vazirmatn", "Inter", sans-serif';
      ctx.fillText(title, 540, artY + artSize + 88);

      ctx.fillStyle = '#57534e';
      ctx.font = '500 31px "Vazirmatn", "Inter", sans-serif';
      ctx.fillText(artist, 540, artY + artSize + 140);
      ctx.restore();

      // Minimal Warm Charcoal Scrubber
      const barW = 680;
      const barH = 8;
      const barX = (1080 - barW) / 2;
      const barY = artY + artSize + 195;

      ctx.save();
      roundRect(ctx, barX, barY, barW, barH, 4);
      ctx.fillStyle = '#e7e5e4';
      ctx.fill();

      const fillW = Math.max(barH, barW * progress);
      roundRect(ctx, barX, barY, fillW, barH, 4);
      ctx.fillStyle = '#1c1917';
      ctx.fill();

      const knobX = barX + barW * progress;
      ctx.beginPath();
      ctx.arc(knobX, barY + barH / 2, 12, 0, Math.PI * 2);
      ctx.fillStyle = '#1c1917';
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.direction = 'ltr';
      ctx.font = '500 22px "Inter", sans-serif';
      ctx.fillStyle = '#78716c';
      ctx.textAlign = 'left';
      ctx.fillText(formatTime(currentSongSec), barX, barY + 40);
      ctx.textAlign = 'right';
      ctx.fillText(formatTime(totalSongSec), barX + barW, barY + 40);
      ctx.restore();

      drawTransportControls(540, barY + 115, 'polaroid', '#1c1917', '#faf8f5');
    }

    function drawTransportControls(cx, cy, style, primaryColor = '#ffffff', centerIconColor = '#000000') {
      ctx.save();
      ctx.fillStyle = primaryColor;

      if (style === 'spotify' || style === 'polaroid') {
        ctx.beginPath();
        ctx.arc(cx, cy, 48, 0, Math.PI * 2);
        ctx.fillStyle = primaryColor;
        ctx.fill();
        ctx.fillStyle = centerIconColor;
      }

      const barW = 12;
      const barH = 38;
      roundRect(ctx, cx - 18, cy - barH / 2, barW, barH, 4);
      ctx.fill();
      roundRect(ctx, cx + 6, cy - barH / 2, barW, barH, 4);
      ctx.fill();

      ctx.fillStyle = primaryColor;
      const offset = style === 'retro' ? 185 : (style === 'cartoon' ? 165 : 155);
      const nextX = cx + offset;
      ctx.beginPath();
      ctx.moveTo(nextX - 18, cy - 20);
      ctx.lineTo(nextX + 12, cy);
      ctx.lineTo(nextX - 18, cy + 20);
      ctx.closePath();
      ctx.fill();
      roundRect(ctx, nextX + 14, cy - 19, 6, 38, 3);
      ctx.fill();

      const prevX = cx - offset;
      ctx.beginPath();
      ctx.moveTo(prevX + 18, cy - 20);
      ctx.lineTo(prevX - 12, cy);
      ctx.lineTo(prevX + 18, cy + 20);
      ctx.closePath();
      ctx.fill();
      roundRect(ctx, prevX - 20, cy - 19, 6, 38, 3);
      ctx.fill();

      ctx.restore();
    }

    function renderVinylTemplate(elapsedSec, clipDuration) {
      drawBackground(elapsedSec, clipDuration);

      const title = songTitleInput.value || 'بدون عنوان';
      const artist = artistNameInput.value || 'ناشناس';
      const rotations = parseInt(vinylRotationsSelect.value, 10) || 2;
      const labelRatio = parseFloat(labelSizeSelect.value) || 0.36;

      const loopProgress = (elapsedSec % clipDuration) / clipDuration;
      const angle = loopProgress * Math.PI * 2 * rotations;

      const sleeveSize = 580;
      const sleeveX = 95;
      const sleeveY = 620;

      const vinylRadius = 280;
      const vinylCenterX = 665;
      const vinylCenterY = sleeveY + sleeveSize / 2;

      ctx.save();
      ctx.translate(vinylCenterX, vinylCenterY);

      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, vinylRadius, 0, Math.PI * 2);
      ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
      ctx.shadowBlur = 45;
      ctx.shadowOffsetX = 12;
      ctx.shadowOffsetY = 18;
      ctx.fillStyle = '#0d0e11';
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.rotate(angle);

      ctx.beginPath();
      ctx.arc(0, 0, vinylRadius, 0, Math.PI * 2);
      ctx.fillStyle = '#111215';
      ctx.fill();

      for (let r = vinylRadius * labelRatio + 14; r < vinylRadius - 10; r += 5) {
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.strokeStyle = (Math.round(r) % 15 === 0) ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }

      const labelRadius = vinylRadius * labelRatio;
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, labelRadius, 0, Math.PI * 2);
      ctx.clip();
      drawSquareImage(ctx, coverImage, -labelRadius, -labelRadius, labelRadius * 2);
      ctx.restore();

      ctx.beginPath();
      ctx.arc(0, 0, labelRadius, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.restore();

      // Safe conic gradient with fallback for older browsers
      if (typeof ctx.createConicGradient === 'function') {
        const sheen = ctx.createConicGradient(-Math.PI / 4, 0, 0);
        sheen.addColorStop(0, 'rgba(255,255,255,0)');
        sheen.addColorStop(0.12, 'rgba(255,255,255,0.13)');
        sheen.addColorStop(0.25, 'rgba(255,255,255,0)');
        sheen.addColorStop(0.5, 'rgba(255,255,255,0)');
        sheen.addColorStop(0.62, 'rgba(255,255,255,0.13)');
        sheen.addColorStop(0.75, 'rgba(255,255,255,0)');
        sheen.addColorStop(1, 'rgba(255,255,255,0)');

        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, vinylRadius, 0, Math.PI * 2);
        ctx.arc(0, 0, labelRadius, 0, Math.PI * 2, true);
        ctx.fillStyle = sheen;
        ctx.fill();
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(0, 0, 14, 0, Math.PI * 2);
      ctx.fillStyle = '#090b10';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.restore();

      drawTonearm(890, 520, 775, 815);

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
      ctx.shadowBlur = 45;
      ctx.shadowOffsetX = 18;
      ctx.shadowOffsetY = 15;
      roundRect(ctx, sleeveX, sleeveY, sleeveSize, sleeveSize, 20);
      ctx.clip();
      drawSquareImage(ctx, coverImage, sleeveX, sleeveY, sleeveSize);

      const spineGrad = ctx.createLinearGradient(sleeveX, sleeveY, sleeveX + 35, sleeveY);
      spineGrad.addColorStop(0, 'rgba(255,255,255,0.28)');
      spineGrad.addColorStop(0.4, 'rgba(0,0,0,0.25)');
      spineGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = spineGrad;
      ctx.fillRect(sleeveX, sleeveY, 35, sleeveSize);
      ctx.restore();

      ctx.save();
      roundRect(ctx, sleeveX, sleeveY, sleeveSize, sleeveSize, 20);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
      ctx.shadowBlur = 20;
      ctx.shadowOffsetY = 4;

      ctx.fillStyle = '#ffffff';
      ctx.font = '700 50px "Vazirmatn", "Inter", sans-serif';
      ctx.fillText(title, 540, 1380);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.font = '500 34px "Vazirmatn", "Inter", sans-serif';
      ctx.fillText(artist, 540, 1442);
      ctx.restore();
    }

    function drawTonearm(pivotX, pivotY, stylusX, stylusY) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(pivotX, pivotY, 34, 0, Math.PI * 2);
      ctx.fillStyle = '#272b36';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(pivotX, pivotY);
      ctx.lineTo(stylusX, stylusY);
      ctx.strokeStyle = '#d1d5db';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 12;
      ctx.stroke();

      ctx.translate(stylusX, stylusY);
      ctx.rotate(0.45);
      roundRect(ctx, -10, -16, 20, 34, 4);
      ctx.fillStyle = '#e5e7eb';
      ctx.fill();
      ctx.restore();
    }

    function animate(now) {
      const clipDuration = getClipDurationSeconds();
      let elapsedSec;

      if (isRecording) {
        elapsedSec = (now - recordStartTimestamp) / 1000;
      } else {
        elapsedSec = ((now - animationStartTime) / 1000) % clipDuration;
      }

      if (currentTemplate === 'player') {
        renderPlayerTemplate(elapsedSec, clipDuration);
      } else {
        renderVinylTemplate(elapsedSec, clipDuration);
      }

      requestAnimationFrame(animate);
    }

    // Helper: Create MediaRecorder safely with multi-tier codec fallback
    function createSafeMediaRecorder(stream, hasAudio) {
      const candidates = hasAudio
        ? [
            'video/mp4;codecs="avc1.42E01E, mp4a.40.2"',
            'video/mp4',
            'video/webm;codecs=vp9,opus',
            'video/webm;codecs=vp8,opus',
            'video/webm'
          ]
        : [
            'video/mp4;codecs=avc1.42E01E',
            'video/mp4',
            'video/webm;codecs=vp9',
            'video/webm;codecs=vp8',
            'video/webm'
          ];

      for (const mime of candidates) {
        if (typeof MediaRecorder.isTypeSupported === 'function' && MediaRecorder.isTypeSupported(mime)) {
          try {
            return {
              recorder: new MediaRecorder(stream, {
                mimeType: mime,
                videoBitsPerSecond: 8_000_000
              }),
              mimeType: mime
            };
          } catch (e) {
            // Try next candidate if constructor rejects specific codec/track pairing
          }
        }
      }

      // Final fallback: let browser pick default container & codec
      const fallbackRecorder = new MediaRecorder(stream);
      return {
        recorder: fallbackRecorder,
        mimeType: fallbackRecorder.mimeType || 'video/webm'
      };
    }

    recordBtn.addEventListener('click', async () => {
      if (isRecording) return;
      stopPreviewAudio();
      showError('');

      try {
        const durationSec = getClipDurationSeconds();
        const fps = parseInt(videoFpsSelect.value, 10) || 60;
        const hasAudio = Boolean(decodedAudioBuffer);

        const canvasStream = canvas.captureStream(fps);
        const combinedTracks = [...canvasStream.getVideoTracks()];

        let recordingAudioSource = null;
        if (hasAudio) {
          const actx = await getAudioContext();
          const destNode = actx.createMediaStreamDestination();
          recordingAudioSource = actx.createBufferSource();
          recordingAudioSource.buffer = decodedAudioBuffer;

          const gainNode = actx.createGain();
          const maxValidStart = Math.max(0, decodedAudioBuffer.duration - 0.25);
          const startOffset = Math.min(getStartOffsetSeconds(), maxValidStart);
          const playDuration = Math.max(0.2, Math.min(durationSec, decodedAudioBuffer.duration - startOffset));
          const now = actx.currentTime;

          if (audioFadeCheck.checked && playDuration > 1.0) {
            gainNode.gain.setValueAtTime(0.001, now);
            gainNode.gain.linearRampToValueAtTime(1.0, now + 0.4);
            gainNode.gain.setValueAtTime(1.0, now + Math.max(0.4, playDuration - 0.4));
            gainNode.gain.linearRampToValueAtTime(0.001, now + playDuration);
          } else {
            gainNode.gain.setValueAtTime(1.0, now);
          }

          recordingAudioSource.connect(gainNode);
          gainNode.connect(destNode);
          gainNode.connect(actx.destination);

          recordingAudioSource.start(0, startOffset, playDuration);
          combinedTracks.push(...destNode.stream.getAudioTracks());
        }

        const finalStream = new MediaStream(combinedTracks);
        const { recorder, mimeType } = createSafeMediaRecorder(finalStream, hasAudio);

        const chunks = [];
        recorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) chunks.push(e.data);
        };

        recorder.onerror = (event) => {
          console.error('MediaRecorder error:', event);
          showError('خطا در ضبط ویدیو رخ داد. لطفاً نرخ فریم ۳۰ را امتحان کنید.');
        };

        recorder.onstop = () => {
          if (recordingAudioSource) {
            try { recordingAudioSource.stop(); } catch (e) {}
            try { recordingAudioSource.disconnect(); } catch (e) {}
          }
          isRecording = false;
          recordBtn.disabled = false;
          recordBtnText.textContent = 'ضبط و دانلود ویدیوی استوری';
          statusBadge.textContent = '✅ ویدیو با موفقیت آماده و دانلود شد!';

          const blob = new Blob(chunks, { type: mimeType || 'video/webm' });
          const ext = (mimeType && mimeType.includes('mp4')) ? 'mp4' : 'webm';
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `instagram-music-story-${Date.now()}.${ext}`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 5000);
        };

        isRecording = true;
        recordStartTimestamp = performance.now();
        recordBtn.disabled = true;
        // Request data every 250ms so large 1080p buffers never stall
        recorder.start(250);

        const interval = setInterval(() => {
          const elapsed = (performance.now() - recordStartTimestamp) / 1000;
          const remaining = Math.max(0, Math.ceil(durationSec - elapsed));
          recordBtnText.textContent = `در حال ضبط... (${remaining} ثانیه)`;
          statusBadge.textContent = `🔴 در حال ضبط ویدیو ${hasAudio ? 'و صدا ' : ''}(${Math.min(100, Math.round((elapsed / durationSec) * 100))}٪)`;
        }, 200);

        setTimeout(() => {
          clearInterval(interval);
          if (recorder.state !== 'inactive') {
            recorder.stop();
          }
        }, durationSec * 1000);

      } catch (err) {
        console.error('Recording initialization failed:', err);
        isRecording = false;
        recordBtn.disabled = false;
        recordBtnText.textContent = 'ضبط و دانلود ویدیوی استوری';
        showError('خطا در شروع ضبط: ' + (err.message || 'مرورگر شما از ضبط همزمان پشتیبانی نمی‌کند.'));
      }
    });

    createDefaultArtwork();
    requestAnimationFrame(animate);
  </script>
