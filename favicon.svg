<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" role="img" aria-label="Instagram Typography Favicon">
  <defs>
    <!-- Background subtle dark container -->
    <radialGradient id="darkBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1b1d28" />
      <stop offset="100%" stop-color="#0b0c10" />
    </radialGradient>

    <!-- Signature Instagram gradient used in the site -->
    <linearGradient id="igGrad" x1="15%" y1="90%" x2="90%" y2="15%">
      <stop offset="0%" stop-color="#f09433" />
      <stop offset="30%" stop-color="#dc2743" />
      <stop offset="65%" stop-color="#cc2366" />
      <stop offset="100%" stop-color="#833ab4" />
    </linearGradient>

    <!-- Subtle inner drop shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#dc2743" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark Squircle Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#darkBg)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="6" />

  <!-- Outer Instagram App-Style Glowing Squircle -->
  <rect x="76" y="76" width="360" height="360" rx="92" fill="none" stroke="url(#igGrad)" stroke-width="26" filter="url(#glow)" />

  <!-- Top-Right Story / Flash Dot -->
  <circle cx="360" cy="152" r="22" fill="url(#igGrad)" />

  <!-- Center Core: Stylized Persian letter 'ت' (Typo) merged with Type Glyph 'T' -->
  <g fill="none" stroke="#f5f6fa" stroke-linecap="round" stroke-linejoin="round">
    <!-- Horizontal crossbar / top contour -->
    <path d="M170 240 Q256 226 342 240" stroke-width="22" stroke="url(#igGrad)" />

    <!-- Deep rounded Persian bowl / typographic stem -->
    <path d="M184 270 C194 336 318 336 328 270" stroke-width="24" stroke="#ffffff" />

    <!-- Two typographic dots for Persian 'ت' -->
    <circle cx="230" cy="200" r="14" fill="#f5f6fa" stroke="none" />
    <circle cx="282" cy="200" r="14" fill="#f5f6fa" stroke="none" />
  </g>
</svg>